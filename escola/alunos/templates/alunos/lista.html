{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'alunos/styles.css' %}">
    <title>Listar aluno</title>
</head>
<body>

    <header class="titulo-principal"></header>

    <main class="centro">
        
        <div class="lista">

            <h2>Alunos cadastrados</h2>
            <p>Confira os alunos registrados no sistema</p>

            <hr>

            <ul>
            {% for aluno in alunos %}
            <li>
                <span class="nome">{{ aluno.nome }}</span>
                <span class="idade">{{ aluno.idade }} anos</span>
            </li>
            {% endfor%}
            </ul>

        </div>

    </main>

    <footer class="rodape">
        <p>Sistema lista de alunos</p>
    </footer>
    
</body>
</html>
