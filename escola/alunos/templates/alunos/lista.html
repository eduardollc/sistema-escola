{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'alunos/styles.css' %}">
    <title>Listar aluno</title>
</head>
<body>

    <header class="titulo-principal">
        <h1>Escola</h1>
    </header>

    <aside class="lado-esquerdo">
        <nav>

            <ul>
                <li>
                    <a href="{% url 'lista_alunos' %}">Lista de alunos</a>
                </li>
            </ul>

            <ul>
                <li>
                    <a href="{% url 'cadastrar_alunos' %}">Cadastrar aluno</a>
                </li>
            </ul>

             <ul>
                <li>
                    <a href="{% url 'cadastrar_professores' %}">Cadastrar professor</a>
                </li>
            </ul>

        </nav>

    </aside>

    <main class="centro">
        
        <div class="lista">

            <h2>Alunos cadastrados</h2>
            <p>Confira os alunos registrados no sistema</p>

            <hr>

            <ul>
            {% for aluno in alunos %}
            <li>
                <span class="nome">{{ aluno.nome }}</span>
                <span class="dados">{{ aluno.idade }} anos</span>
            </li>
            {% endfor%}
            </ul>

        </div>

    </main>

    <footer class="rodape">
        <p>Sistema lista de alunos</p>
    </footer>
    
</body>
</html>
