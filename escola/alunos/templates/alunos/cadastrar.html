{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'alunos/styles.css' %}">
    <title>Cadastrar aluno</title>
</head>
<body>

    <header class="titulo-principal">
        <h1>Escola</h1>
    </header>

    <aside class="lado-esquerdo">
        <nav>
            <ul>
                <li>
                    <a href="{% url 'lista_alunos' %}">Lista de alunos</a>
                </li>
            </ul>
        </nav>

    </aside>

    <main class="centro">

        <div class="formulario">

            <h2>Cadastro de alunos</h2>
            <p>Preencha os dados para cadastrar um novo aluno.</p>

            <hr>

            <form method="POST">
                {% csrf_token%}
                <label for="matricula">Matrícula</label>
                <input type="text" name="matricula" placeholder="Digite a matricula" required>

                <label for="nome">Nome do aluno</label>
                <input type="text" name="nome" placeholder="Digite o nome completo" required>

                <label for="cpf">CPF</label>
                <input type="text" name="cpf" placeholder="00000000000" required>

                <label for="idade">Idade</label>
                <input type="number" name="idade" placeholder="Idade do aluno" required>

                <label for="email">Email</label>
                <input type="email" name="email" placeholder="exemplo@email.com" required>

                <label for="telefone">Telefone</label>
                <input type="text" name="telefone" placeholder="(00) 00000-0000">

                <label for="endereco">Endereço</label>
                <input type="text" name="endereco" placeholder="Endereço do aluno">

                <input class="botao" type="submit" value="Cadastrar aluno">
             </form>

        </div> 

    </main>

    <footer class="rodape">
        <p>Sistema cadastro de alunos</p>
    </footer>

</body>
</html>
